<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - Minimal Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="small-header">
  <h1 id="section-title">Notes</h1>
  <button onclick="goBackDashboard()" class="logout-btn">Dashboard</button>
</header>

<main class="notes-container">

  <div id="subject-container" class="fade-in">
    <h2>Select a Subject</h2>
  </div>

  <div id="chapter-container" class="hidden fade-in"></div>

  <div id="code-container" class="hidden fade-in">
    <h3>Enter Access Code</h3>
    <input id="code-input" placeholder="Enter your code" />
    <button onclick="verifyCode()">Submit</button>
  </div>

  <div id="pdf-container" class="hidden fade-in"></div>

</main>

<script src="script.js"></script>
</body>
</html>
