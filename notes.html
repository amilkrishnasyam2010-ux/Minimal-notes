<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Selection - Minimal Notes</title>

  <!-- IMPORTANT: MUST match the filename in GitHub -->
  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <!-- TOP NAV (Matches Homepage + Dashboard) -->
  <header class="top-nav">
    <div class="left-nav">
      <img src="images/logo.png" class="nav-logo" alt="Logo">
      <span class="brand-name">Minimal Notes</span>
    </div>

    <div class="right-nav">
      <button class="account-btn" onclick="goBackDashboard()">Dashboard</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="notes-container" style="padding-top:120px;">

    <!-- Step 1: Choose Subject -->
    <div id="subject-container" class="fade-in">
      <h2>Select a Subject</h2>
      <!-- JS inserts buttons -->
    </div>

    <!-- Step 2: Choose Chapter -->
    <div id="chapter-container" class="hidden fade-in"></div>

    <!-- Step 3: Enter Code -->
    <div id="code-container" class="hidden fade-in">
      <h3>Enter Access Code</h3>
      <input type="text" id="code-input" placeholder="Enter your code" />
      <button onclick="verifyCode()">Submit</button>
    </div>

    <!-- Step 4: PDF Display -->
    <div id="pdf-container" class="hidden fade-in"></div>

  </main>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
