<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Bank - Minimal Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="small-header">
  <h1>Question Bank</h1>
  <button onclick="goBackDashboard()" class="logout-btn">Dashboard</button>
</header>

<main class="notes-container">

  <!-- Step 1: Subjects -->
  <div id="qb-subjects">
    <h2>Select a Subject</h2>
  </div>

  <!-- Step 2: Chapters -->
  <div id="qb-chapters" class="hidden"></div>

  <!-- Step 3: Code -->
  <div id="qb-code-box" class="hidden">
    <h3>Enter Access Code</h3>
    <input id="qb-code" type="text" placeholder="Enter your code">
    <button onclick="verifyQBCode()">Submit</button>
  </div>

  <!-- Step 4: PDF -->
  <div id="qb-pdf-box" class="hidden"></div>

</main>

<script src="script.js"></script>
</body>
</html>
