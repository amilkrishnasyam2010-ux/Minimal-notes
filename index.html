<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimal Notes</title>
  <!-- NOTE: your repo shows styles.css (plural). Keep this name exactly. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top nav -->
  <header class="top-nav">
    <div class="left-nav">
      <img src="images/logo.png" class="nav-logo" alt="Minimal Notes Logo" onerror="this.style.display='none'">
      <span class="brand-name">Minimal Notes</span>
    </div>
    <div class="right-nav">
      <button onclick="openLogin()">Sign in</button>
<button onclick="openSignup()">Sign Up</button>

    </div>
  </header>

  <!-- Dropdown/menu and modals are created by script.js when needed -->
  <main style="padding-top:86px;">
    <section class="hero" aria-label="hero">
      <h1> One place for </h1>
      <h1>  all your learning </h1>
      <p class="tagline">Access notes, question banks, and one-word </p>
      <p class="tagline">answers — beautifully organized and always in sync across </p>
      <p class="tagline">  your subjects </p>
    </section>

    <section class="features" id="features">
      <h2>Why Minimal Notes?</h2>
      <div class="feature-grid">
        <div class="feature-card">Organized notes</div>
        <div class="feature-card">Instant access</div>
        <div class="feature-card">Download anytime</div>
      </div>
    </section>
  </main>

  <!-- fallback small script to ensure there is always a script file reference -->
  <script src="script.js"></script>
</body>
</html>
