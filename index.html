<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Notes</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- TOP NAV (Superlist Style) -->
  <header class="top-nav">
    <div class="left-nav">
      <img src="images/logo.png" class="nav-logo" alt="Minimal Notes Logo">
      <span class="brand-name">Minimal Notes</span>
    </div>

    <div class="right-nav">
      <button class="nav-btn" onclick="openAccountMenu()">Account ⌄</button>
    </div>
  </header>

  <!-- DROPDOWN MENU -->
  <div id="account-menu" class="dropdown hidden">
    <button onclick="openLoginModal()">Login</button>
    <button onclick="openSignupModal()">Sign Up</button>
  </div>

  <!-- AUTH MODALS -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-box">
      <span class="close" onclick="closeModal()">×</span>
      <h2 id="modal-title"></h2>

      <input id="modal-username" placeholder="Username">
      <input id="modal-password" placeholder="Password" type="password">

      <div id="confirm-password-box" class="hidden">
        <input id="modal-confirm" placeholder="Confirm Password" type="password">
      </div>

      <button id="modal-action-btn"></button>

      <!-- Change Password Option (inside modal, hidden initially) -->
      <button id="change-pass-btn" class="small-btn hidden" onclick="openChangePassword()">Change Password</button>

      <div id="change-pass-box" class="hidden">
        <input id="old-pass" type="password" placeholder="Old Password">
        <input id="new-pass" type="password" placeholder="New Password">
        <button class="small-btn" onclick="submitPasswordChange()">Save</button>
      </div>

    </div>
  </div>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1>🔥 Minimal Notes</h1>
    <p class="tagline">Free + Premium Exam-Ready Notes — Super Simplified</p>
  </section>

</body>
<script src="script.js"></script>
</html>
