<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- SUPERLIST STYLE TOP BAR -->
  <header class="top-bar">
    <img src="images/logo.png" class="logo" alt="Minimal Notes Logo">

    <button class="account-btn" onclick="toggleAccountMenu()">Account ⌄</button>

    <!-- DROPDOWN MENU -->
    <div id="account-menu" class="dropdown hidden">
      <button onclick="openLogin()">Login</button>
      <button onclick="openSignup()">Sign Up</button>
      <button onclick="openChangePass()">Change Password</button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1>Minimal Notes</h1>
    <p class="tagline">Making Notes Minimal 📘</p>
  </section>

  <!-- FEATURES -->
  <section class="features">
    <h2> Minimal Notes – Free + Premium Exam-Ready Notes</h2>
    <p class="sub">Super simplified. Download now. All subjects will be added soon.</p>

    <div class="feature-grid">
      <div class="feature-card">High-quality Notes</div>
      <div class="feature-card">Question Banks</div>
      <div class="feature-card">One Word Key Points</div>
    </div>
  </section>

  <!-- LOGIN / SIGNUP / CHANGE PASSWORD MODALS -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-content">

      <span class="close-modal" onclick="closeModal()">×</span>

      <!-- LOGIN -->
      <div id="login-box">
        <h2>Login</h2>
        <input id="login-username" placeholder="Username">
        <input id="login-password" type="password" placeholder="Password">
        <button onclick="loginUser()">Login</button>
      </div>

      <!-- SIGNUP -->
      <div id="signup-box" class="hidden">
        <h2>Create Account</h2>
        <input id="signup-username" placeholder="Username">
        <input id="signup-password" type="password" placeholder="Password">
        <button onclick="signupUser()">Sign Up</button>
      </div>

      <!-- CHANGE PASSWORD -->
      <div id="change-pass-box" class="hidden">
        <h2>Change Password</h2>
        <input id="old-pass" type="password" placeholder="Old Password">
        <input id="new-pass" type="password" placeholder="New Password">
        <button onclick="changePassword()">Update</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
