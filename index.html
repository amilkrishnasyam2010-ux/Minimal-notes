<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ───────── TOP BAR ───────── -->
  <div class="top-bar">
    <img src="images/logo.png" class="logo" alt="Minimal Notes Logo">

    <button class="account-btn" onclick="toggleAccountMenu()">Account ⌄</button>

    <!-- DROPDOWN MENU -->
    <div id="account-menu" class="auth-popup hidden">
      <button onclick="openModal('login-modal')">Login</button>
      <button onclick="openModal('signup-modal')">Sign Up</button>
      <button onclick="openModal('password-modal')">Change Password</button>
    </div>
  </div>

  <!-- ───────── HERO SECTION ───────── -->
  <header class="hero">
    <h1>🔥 Minimal Notes</h1>
    <p class="tagline">Free + Premium Exam-Ready Notes — Super Simplified 📘</p>
  </header>


  <!-- ───────── MODALS (POPUPS) ───────── -->

  <!-- LOGIN -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('login-modal')">×</span>
      <h2>Login</h2>
      <input id="login-username" placeholder="Username" />
      <input id="login-password" type="password" placeholder="Password" />
      <button onclick="loginUser()">Login</button>
    </div>
  </div>

  <!-- SIGNUP -->
  <div id="signup-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('signup-modal')">×</span>
      <h2>Create Account</h2>
      <input id="signup-username" placeholder="Username" />
      <input id="signup-password" type="password" placeholder="Password" />
      <button onclick="signupUser()">Sign Up</button>
    </div>
  </div>

  <!-- CHANGE PASSWORD -->
  <div id="password-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('password-modal')">×</span>
      <h2>Change Password</h2>
      <input id="old-pass" type="password" placeholder="Old Password" />
      <input id="new-pass" type="password" placeholder="New Password" />
      <button onclick="changePassword()">Save</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
