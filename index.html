<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Notes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SUPERLIST STYLE TOP NAV -->
  <nav class="top-nav">
    <div class="left-section">
      <img src="images/logo.png" class="nav-logo" alt="Minimal Notes Logo">
      <span class="brand-name">Minimal Notes</span>
    </div>

    <div class="right-section">
      <button onclick="openLogin()" class="nav-btn">Sign In</button>
      <button onclick="openSignup()" class="nav-btn highlight">Sign Up</button>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <header class="hero">
    <h1>🔥 Minimal Notes</h1>
    <p class="tagline">Free + Premium Exam-Ready Notes — Super Simplified 📘</p>
  </header>

  <!-- ===== MODALS ===== -->

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('login-modal')">×</span>
      <h2>Login</h2>

      <input id="login-username" placeholder="Username" />
      <input id="login-password" type="password" placeholder="Password" />

      <button onclick="loginUser()">Login</button>

      <p class="link" onclick="openChangePass()">Change Password</p>
      <p class="link" onclick="switchToSignup()">Create an account</p>
    </div>
  </div>

  <!-- SIGNUP MODAL -->
  <div id="signup-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('signup-modal')">×</span>
      <h2>Create Account</h2>

      <input id="signup-username" placeholder="Username">
      <input id="signup-password" type="password" placeholder="Password">

      <button onclick="signupUser()">Sign Up</button>

      <p class="link" onclick="switchToLogin()">Already have an account?</p>
    </div>
  </div>

  <!-- CHANGE PASSWORD MODAL -->
  <div id="change-pass-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('change-pass-modal')">×</span>
      <h2>Change Password</h2>

      <input id="old-pass" type="password" placeholder="Old Password">
      <input id="new-pass" type="password" placeholder="New Password">

      <button onclick="changePassword()">Save</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
