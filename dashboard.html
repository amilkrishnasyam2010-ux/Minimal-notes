<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Minimal Notes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="top-nav">
    <div class="left-nav">
      <img src="images/logo.png" class="nav-logo" alt="Logo" />
      <span class="brand-name">Minimal Notes</span>
    </div>
    <div class="right-nav">
      <button class="account-btn" onclick="logoutUser()">Logout</button>
    </div>
  </header>

  <header class="small-header" style="margin-top:72px;">
    <h1>Welcome, <span id="user-name"></span> 👋</h1>
  </header>

  <main class="dashboard" style="padding:24px;">
    <section>
      <h2>Your Downloads</h2>
      <ul id="downloaded-list"></ul>
    </section>

    <section style="margin-top:20px;">
      <h2>Explore</h2>
      <div class="dashboard-btns">
        <button onclick="goTo('notes')">🗒️ Notes</button>
        <button onclick="goTo('questions')">❓ Question Bank</button>
        <button onclick="goTo('oneword')">🧩 One Word</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
