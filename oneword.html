<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One Word - Minimal Notes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="top-nav">
  <div class="left-nav">
    <img src="images/logo.png" class="nav-logo" alt="Logo" />
    <span class="brand-name">Minimal Notes</span>
  </div>
  <div class="right-nav">
    <button class="account-btn" onclick="goBackDashboard()">Dashboard</button>
  </div>
</header>

<main class="notes-container" style="padding-top:92px;">
  <div id="oneword-subjects"><h2>Select a Subject</h2></div>
  <div id="oneword-chapters" class="hidden"></div>
  <div id="oneword-code" class="hidden">
    <h3>Enter Access Code</h3>
    <input id="oneword-code-input" placeholder="Enter code" />
    <button onclick="verifyCode()">Submit</button>
  </div>
  <div id="oneword-pdf-box" class="hidden"></div>
</main>

<script src="script.js"></script>
</body>
</html>
